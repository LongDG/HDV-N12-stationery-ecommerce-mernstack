version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hdv-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vanphongpham
    volumes:
      - mongodb_data:/data/db
      - ./Database:/docker-entrypoint-initdb.d:ro
    networks:
      - hdv-network

  # Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hdv-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/vanphongpham
      JWT_SECRET: hdv-secret-key-2026
      JWT_EXPIRE: 7d
    depends_on:
      - mongodb
    networks:
      - hdv-network
    volumes:
      - ./Backend:/app
      - /app/node_modules

  # Frontend React App
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: hdv-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hdv-network
    volumes:
      - ./images:/usr/share/nginx/images:ro

networks:
  hdv-network:
    driver: bridge

volumes:
  mongodb_data:
